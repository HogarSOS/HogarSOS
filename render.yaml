services:
  - type: web
    name: hogarsos-backend
    runtime: node
    plan: starter
    region: oregon
    # NODE_ENV=production (más abajo) hace que `npm install` a secas
    # omita devDependencies — y ahí viven typescript, los @types/* y el
    # CLI de prisma, todos necesarios para compilar. `--include=dev`
    # fuerza su instalación pase lo que pase.
    #
    # Las migraciones corren aquí, en el build, con el CLI de prisma
    # todavía instalado — no en startCommand, porque `npm prune
    # --omit=dev` al final se lo lleva (es una devDependency) y en
    # startCommand ya no estaría disponible sin volver a descargarlo
    # por red en cada arranque. `npm prune --omit=dev` al final deja
    # el contenedor en producción sin herramientas de build que no
    # necesita en runtime (typescript, @types/*, el propio prisma CLI).
    buildCommand: npm install --include=dev && npx prisma generate && npm run build && npx prisma migrate deploy && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    # El plan free de Render no admitía discos persistentes: las fotos
    # subidas a /uploads (perfil, verificación) se perdían en cada
    # redeploy o reinicio del servicio. Ya en Starter, disco persistente
    # real para que esas fotos sobrevivan a los despliegues.
    disk:
      name: hogarsos-uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      # Apunta a la base de datos Supabase existente (no una nueva de
      # Render) para conservar categorías y profesionales ya creados.
      # Rellenar a mano en el dashboard con la misma DATABASE_URL del
      # .env local.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: PLATFORM_COMMISSION_CLIENT_PERCENT
        value: "0"
      - key: PLATFORM_COMMISSION_PROFESSIONAL_PERCENT
        value: "0"
      - key: REQUIRE_PROFESSIONAL_VERIFICATION
        value: "true"
      # Rellenar a mano en el dashboard de Render (Environment ->
      # "Add Environment Variable"), nunca commitear estos valores:
      - key: APP_BASE_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
