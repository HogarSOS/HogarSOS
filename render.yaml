services:
  - type: web
    name: hogarsos-backend
    runtime: node
    plan: starter
    region: oregon
    # NODE_ENV=production (más abajo) hace que `npm install` a secas
    # omita devDependencies — y ahí viven typescript, los @types/* y el
    # CLI de prisma, todos necesarios para compilar. `--include=dev`
    # fuerza su instalación pase lo que pase.
    #
    # Las migraciones corren aquí, en el build, con el CLI de prisma
    # todavía instalado — no en startCommand, porque `npm prune
    # --omit=dev` al final se lo lleva (es una devDependency) y en
    # startCommand ya no estaría disponible sin volver a descargarlo
    # por red en cada arranque. `npm prune --omit=dev` al final deja
    # el contenedor en producción sin herramientas de build que no
    # necesita en runtime (typescript, @types/*, el propio prisma CLI).
    buildCommand: npm install --include=dev && npx prisma generate && npm run build && npx prisma migrate deploy && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    # El plan free de Render no admitía discos persistentes: las fotos
    # subidas a /uploads (perfil, verificación) se perdían en cada
    # redeploy o reinicio del servicio. Ya en Starter, disco persistente
    # real para que esas fotos sobrevivan a los despliegues.
    disk:
      name: hogarsos-uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      # Apunta a la base de datos Supabase existente (no una nueva de
      # Render) para conservar categorías y profesionales ya creados.
      # Rellenar a mano en el dashboard con la misma DATABASE_URL del
      # .env local.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      # Decisión de producto definitiva (2026-08-18, revisión pre-lanzamiento
      # nacional): el CLIENTE paga un 10% sobre el presupuesto ("Gastos de
      # gestión"), el PROFESIONAL no paga nada y recibe el 100% de lo que
      # cotizó. HogarSOS sigue absorbiendo la fee de Stripe por ahora.
      # Declaradas aquí con valor explícito (no sync:false) a propósito:
      # así el blueprint es la fuente de verdad y nadie puede dejarlas a 0
      # sin querer en el dashboard, que era el riesgo real (plataforma sin
      # ingresos).
      - key: PLATFORM_COMMISSION_CLIENT_PERCENT
        value: "10"
      - key: PLATFORM_COMMISSION_PROFESSIONAL_PERCENT
        value: "0"
      - key: REQUIRE_PROFESSIONAL_VERIFICATION
        value: "true"
      # Rellenar a mano en el dashboard de Render (Environment ->
      # "Add Environment Variable"), nunca commitear estos valores.
      #
      # src/config/validateEnv.ts comprueba TODAS estas al arrancar y
      # aborta si falta alguna de las que corrompen el comportamiento —
      # así un despliegue mal configurado falla en Render y deja en pie
      # la versión anterior, en vez de servir una que finge cobrar.
      #
      # APP_BASE_URL: https://hogarsos.es (sin barra final). Sin ella,
      # el retorno del onboarding de Stripe Connect y las URLs de las
      # fotos subidas apuntan a localhost.
      - key: APP_BASE_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      # Usada solo por passwordReset.routes.ts (Web API Key de Firebase,
      # pública por diseño — es la misma clase de clave que la
      # publishable key de Stripe, no un secreto de servidor). El código
      # todavía tiene un fallback hardcodeado con el valor actual por si
      # esta variable faltara en Render; limpieza pendiente: confirmar
      # que Render ya la tiene puesta y entonces retirar el fallback del
      # código (auditoría pre-lanzamiento, 2026-08-14).
      - key: FIREBASE_WEB_API_KEY
        sync: false
      # LANZAMIENTO (auditoría B1): debe ser la clave sk_live_... de la
      # cuenta real. Con NODE_ENV=production y una sk_test, el arranque
      # aborta a propósito (usa ALLOW_STRIPE_TEST_IN_PRODUCTION=true si
      # algún día quieres un staging contra Stripe de pruebas).
      - key: STRIPE_SECRET_KEY
        sync: false
      # OJO: el "Signing secret" (whsec_...) del endpoint de webhook es
      # DISTINTO en test y en live. Al pasar a live hay que crear el
      # endpoint en el dashboard en modo Live y copiar SU secreto — el de
      # test haría que todos los eventos se rechazaran por firma inválida.
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Correo transaccional (IONOS, soporte@hogarsos.es). Sin estas, la
      # recuperación de contraseña responde {success:true} sin enviar
      # nada — el arranque avisa muy visiblemente pero no aborta.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
