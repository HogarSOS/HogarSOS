databases:
  # Plan free: Render borra la base de datos automáticamente a los 30
  # días de creada. Antes de esa fecha, o en cuanto haya datos reales
  # que importe conservar, pasar a un plan de pago (Starter o
  # superior) — Render lo permite sin volver a crear la base.
  - name: hogarsos-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: hogarsos-backend
    runtime: node
    plan: free
    region: oregon
    # NODE_ENV=production (más abajo) hace que `npm install` a secas
    # omita devDependencies — y ahí viven typescript, los @types/* y el
    # CLI de prisma, todos necesarios para compilar. `--include=dev`
    # fuerza su instalación pase lo que pase.
    #
    # Las migraciones corren aquí, en el build, con el CLI de prisma
    # todavía instalado — no en startCommand, porque `npm prune
    # --omit=dev` al final se lo lleva (es una devDependency) y en
    # startCommand ya no estaría disponible sin volver a descargarlo
    # por red en cada arranque. `npm prune --omit=dev` al final deja
    # el contenedor en producción sin herramientas de build que no
    # necesita en runtime (typescript, @types/*, el propio prisma CLI).
    buildCommand: npm install --include=dev && npx prisma generate && npm run build && npx prisma migrate deploy && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    # El plan free de Render no admite discos persistentes: las fotos
    # subidas a /uploads (perfil, verificación) se pierden en cada
    # redeploy o reinicio del servicio. Al pasar a un plan de pago
    # (Starter o superior), añadir aquí:
    #   disk:
    #     name: hogarsos-uploads
    #     mountPath: /opt/render/project/src/uploads
    #     sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hogarsos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: PLATFORM_COMMISSION_PERCENT
        value: "18"
      - key: REQUIRE_PROFESSIONAL_VERIFICATION
        value: "true"
      # Rellenar a mano en el dashboard de Render (Environment ->
      # "Add Environment Variable"), nunca commitear estos valores:
      - key: APP_BASE_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
